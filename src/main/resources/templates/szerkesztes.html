<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Szerkesztés</title>
    <style>
        body { font-family: sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #337ab7; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Módosítás</h2>
    <form th:action="@{/frissites}" th:object="${biciklizes}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Dátum:</label>
        <input type="date" th:field="*{datum}" required>

        <label>Távolság (km):</label>
        <input type="number" step="0.1" th:field="*{tavolsagKm}" required>

        <label>Időtartam (perc):</label>
        <input type="number" th:field="*{idotartamPerc}" required>

        <label>Megjegyzés:</label>
        <input type="text" th:field="*{megjegyzes}">

        <button type="submit">Változtatások mentése</button>
        <br><br>
        <a href="/bringak">Mégse</a>
    </form>
</div>
</body>
</html>
